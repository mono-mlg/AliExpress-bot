name: 🛒 AliExpress Bot

on:
  schedule:
    # Cada 10 minutos (GitHub mínimo real ~5-10 min de retraso, es normal)
    - cron: "*/10 * * * *"
  workflow_dispatch:   # permite lanzarlo manualmente desde GitHub

permissions:
  contents: write      # necesario para guardar historial.json en el repo

jobs:
  publicar-ofertas:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: 📥 Checkout repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Instalar dependencias
        run: pip install requests

      - name: 🤖 Ejecutar bot
        env:
          ALI_APP_KEY:      ${{ secrets.ALI_APP_KEY }}
          ALI_APP_SECRET:   ${{ secrets.ALI_APP_SECRET }}
          ALI_TRACKING_ID:  ${{ secrets.ALI_TRACKING_ID }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CUPON_FIJO:       ${{ secrets.CUPON_FIJO }}
        run: python bot.py

      - name: 💾 Guardar historial actualizado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          python3 -c "
import json, subprocess
result = subprocess.run(['git', 'show', 'origin/main:historial.json'], capture_output=True, text=True)
remoto = set(json.loads(result.stdout)) if result.returncode == 0 else set()
with open('historial.json') as f:
    local = set(json.load(f))
merged = list(remoto | local)[-500:]
with open('historial.json', 'w') as f:
    json.dump(merged, f)
"
          git add historial.json
          git diff --staged --quiet || git commit -m "📝 Historial actualizado $(date +'%Y-%m-%d %H:%M')"
          git push
