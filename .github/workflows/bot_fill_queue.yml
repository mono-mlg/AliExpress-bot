name: 📋 Rellenar Cola

on:
  schedule:
    - cron: "0 */3 * * *"   # cada 3 horas
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  rellenar-cola:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: 📥 Checkout repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Instalar dependencias
        run: pip install requests

      - name: 📋 Rellenar cola
        env:
          ALI_APP_KEY:      ${{ secrets.ALI_APP_KEY }}
          ALI_APP_SECRET:   ${{ secrets.ALI_APP_SECRET }}
          ALI_TRACKING_ID:  ${{ secrets.ALI_TRACKING_ID }}
          GH_TOKEN:         ${{ secrets.GH_TOKEN }}
          GH_USER:          mono-mlg
          GH_REPO:          AliExpress-bot
        run: python bot_fill_queue.py

      - name: 💾 Guardar historial
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git show origin/main:historial.json > historial_remoto.json 2>/dev/null || echo "[]" > historial_remoto.json
          python3 merge_historial.py
          git add historial.json
          git diff --staged --quiet || git commit -m "📝 Historial actualizado $(date +'%Y-%m-%d %H:%M')"
          git push --force-with-lease
