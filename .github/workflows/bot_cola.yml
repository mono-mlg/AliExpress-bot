name: 🛒 AliExpress Bot Cola

on:
  schedule:
    - cron: "*/05 * * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  publicar-cola:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: 📥 Checkout repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Instalar dependencias
        run: pip install requests Pillow

      - name: 🤖 Ejecutar bot cola
        env:
          ALI_APP_KEY:      ${{ secrets.ALI_APP_KEY }}
          ALI_APP_SECRET:   ${{ secrets.ALI_APP_SECRET }}
          ALI_TRACKING_ID:  ${{ secrets.ALI_TRACKING_ID }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CUPON_FIJO:       ${{ secrets.CUPON_FIJO }}
        run: python bot_cola.py

      - name: 💾 Guardar cola actualizada
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git show origin/main:cola.txt > cola_remota.txt 2>/dev/null || echo "" > cola_remota.txt
          python3 merge_cola.py
          git add cola.txt
          git diff --staged --quiet || git commit -m "📝 Cola actualizada $(date +'%Y-%m-%d %H:%M')"
          git push --force-with-lease
